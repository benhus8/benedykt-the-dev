{{ if and .IsPage (eq .Section "post") }}
<style>
  #reading-progress {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    z-index: 9999;
    pointer-events: none;
    background: linear-gradient(90deg, rgba(0, 0, 0, 0.08) 0%, rgba(0, 0, 0, 0.15) 100%);
    backdrop-filter: blur(2px);
  }

  #reading-progress__bar {
    display: block;
    width: 0%;
    height: 100%;
    background: linear-gradient(100deg, #89ff00 0%, #24e36a 35%, #00c853 60%, #00b0ff 100%);
    background-size: 220% 100%;
    box-shadow: 0 0 12px rgba(36, 227, 106, 0.65), 0 0 24px rgba(0, 176, 255, 0.35);
    transition: width 0.1s linear;
    animation: progress-gradient-flow 4s linear infinite;
    position: relative;
    overflow: hidden;
  }

  #reading-progress__bar::after {
    content: "";
    position: absolute;
    top: 0;
    left: -20%;
    width: 18%;
    height: 100%;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.55) 50%, rgba(255, 255, 255, 0) 100%);
    animation: progress-shine 2.6s ease-in-out infinite;
  }

  [data-scheme="dark"] #reading-progress {
    background: rgba(255, 255, 255, 0.14);
  }

  @keyframes progress-gradient-flow {
    0% {
      background-position: 0% 0%;
    }
    100% {
      background-position: 100% 0%;
    }
  }

  @keyframes progress-shine {
    0% {
      transform: translateX(0);
      opacity: 0;
    }
    20% {
      opacity: 1;
    }
    100% {
      transform: translateX(700%);
      opacity: 0;
    }
  }
</style>
{{ end }}
